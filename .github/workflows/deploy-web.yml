# 웹 버전을 GitHub Pages 에 올린다.
#
# main 브랜치에 push 하면 자동으로 빌드 → 배포된다.
# 주소: https://<깃허브아이디>.github.io/<저장소이름>/
#
# 처음 한 번만: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
#
# 빌드 결과물(dist-web)은 저장소에 커밋하지 않는다(.gitignore). 여기서 매번 새로 만든다.
name: 웹 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 push 해도 배포가 겹치지 않게 순서대로
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci
        env:
          # 웹 빌드에는 Electron 실행 파일이 필요 없다. 받지 않으면 설치가 훨씬 빠르다.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # 타입이 깨진 채로 배포되지 않게. (build:web 은 vite 만 돌려서 타입을 안 본다)
      - name: 타입 검사
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: 웹 빌드
        run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
